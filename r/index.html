<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Contact details | Gregory W. Kyro, PhD</title>
    <link rel="icon" type="image/png" href="https://gregorykyro.com/images/logo8.png">
    <style>
        :root { --fg:#f5f5f7; --muted:#8a8a8f; --soft:#c7c7cc; --accent:#0a84ff; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #000; color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased; padding: 1.5rem;
        }
        .card {
            width: 100%; max-width: 440px; text-align: center;
            border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
            padding: 2.6rem 2rem; background: rgba(255,255,255,.02);
        }
        .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 1.4rem; }
        h1 { font-weight: 600; font-size: 1.15rem; letter-spacing: -.01em; margin: 0 0 .4rem; }
        p { color: var(--soft); line-height: 1.6; font-size: .96rem; margin: .5rem 0; }
        .num { font-size: 1.9rem; font-weight: 600; letter-spacing: .02em; margin: 1.4rem 0 .6rem; color: #fff; }
        .num a { color: #fff; text-decoration: none; }
        .btn {
            display: inline-flex; align-items: center; gap: .5rem; margin-top: 1.4rem;
            font-size: .9rem; font-weight: 500; text-decoration: none;
            color: #000; background: var(--fg); padding: .6rem 1.3rem; border-radius: 999px;
            transition: background .2s ease;
        }
        .btn:hover { background: #fff; }
        .muted { color: var(--muted); font-size: .82rem; margin-top: 1.6rem; }
        .spinner { width: 26px; height: 26px; border: 2px solid rgba(255,255,255,.18); border-top-color: var(--fg); border-radius: 50%; margin: 1rem auto; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <p class="eyebrow">Gregory W. Kyro, PhD</p>

        <div id="loading">
            <div class="spinner"></div>
            <p>Retrieving secure contact details…</p>
        </div>

        <div id="success" class="hidden">
            <h1>Direct phone number</h1>
            <p class="num"><a id="tel" href="#"></a></p>
            <p class="muted">This link is one-time and is now used. Please save the number.</p>
        </div>

        <div id="error" class="hidden">
            <h1 id="err-title">Link expired</h1>
            <p id="err-msg">This secure link has already been used or has expired.</p>
            <a class="btn" href="/contact">Request again</a>
        </div>
    </div>

    <script>
        var API = "https://gwk-chat.bibleverse.workers.dev";
        function show(id) {
            ["loading", "success", "error"].forEach(function (x) {
                document.getElementById(x).classList.toggle("hidden", x !== id);
            });
        }
        function getToken() {
            var q = new URLSearchParams(window.location.search);
            return q.get("t") || q.get("token") || "";
        }
        function fail(title, msg) {
            if (title) document.getElementById("err-title").textContent = title;
            if (msg) document.getElementById("err-msg").textContent = msg;
            show("error");
        }
        (function () {
            var token = getToken();
            if (!token) { fail("Invalid link", "This link is missing its access token."); return; }
            fetch(API + "/api/reveal?format=json&token=" + encodeURIComponent(token))
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                .then(function (res) {
                    if (res.j && res.j.ok && res.j.phone) {
                        var tel = document.getElementById("tel");
                        tel.textContent = res.j.phone;
                        tel.href = "tel:" + res.j.phone.replace(/[^+0-9]/g, "");
                        show("success");
                    } else {
                        fail(null, null);
                    }
                })
                .catch(function () {
                    fail("Something went wrong", "Please try opening the link again, or request a new one.");
                });
        })();
    </script>
</body>
</html>
