    <script>
        const canvas = document.getElementById('neural-network');
        const ctx = canvas.getContext('2d');


        function setCanvasDimensions() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }


        setCanvasDimensions();


        const nodes = [];
        const connections = [];
        const nodeCount = window.innerWidth <= 768 ? 15 : 150;
        const connectionDistance = 200;
        const nodeSize = 2;
        const nodeColor = 'rgba(255, 255, 255, 0.55)';
        const connectionColor = 'rgba(255, 255, 255, 0.07)';


        function initializeNodes() {
            nodes.length = 0;


            for (let i = 0; i < nodeCount; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5
                });
            }
        }


        initializeNodes();


        function animate() {
            requestAnimationFrame(animate);


            ctx.clearRect(0, 0, canvas.width, canvas.height);


            nodes.forEach(node => {
                node.x += node.vx;
                node.y += node.vy;


                if (node.x < 0) node.x = canvas.width;
                if (node.x > canvas.width) node.x = 0;
                if (node.y < 0) node.y = canvas.height;
                if (node.y > canvas.height) node.y = 0;


                ctx.beginPath();
                ctx.arc(node.x, node.y, nodeSize, 0, Math.PI * 2);
                ctx.fillStyle = nodeColor;
                ctx.fill();
            });


            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = connectionColor;
                        ctx.lineWidth = 1 - distance / connectionDistance;
                        ctx.stroke();
                    }
                }
            }
        }


        window.addEventListener('resize', () => {
            setCanvasDimensions();
            initializeNodes();
        });


        animate();
    </script>

    <script>
        // ---- crisp entry + descent into the About dimension ----
        (function () {
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // clean fade-in on entry (double rAF so the transition actually runs)
            requestAnimationFrame(function () {
                requestAnimationFrame(function () { document.body.classList.add('is-ready'); });
            });

            // Pull the About page in beneath the hero — single source of truth.
            const mount = document.getElementById('about-mount');
            fetch('/about/', { credentials: 'same-origin' })
                .then(function (r) { if (!r.ok) throw new Error('fetch failed'); return r.text(); })
                .then(function (html) {
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const header = doc.querySelector('header.header');
                    const container = doc.querySelector('.container');
                    const footer = doc.querySelector('footer.footer');
                    let out = '';
                    if (header) out += header.outerHTML;
                    if (container) out += container.outerHTML;
                    if (footer) out += footer.outerHTML;
                    if (out) mount.innerHTML = out;
                })
                .catch(function () {
                    mount.innerHTML = '<div class="container"><article class="content about-section" style="text-align:center"><p>Read more <a href="/about/">about me &rarr;</a></p></article></div>';
                });

            // Scroll-driven transition: the cosmos recedes as the About dimension rises.
            if (!reduce) {
                const hero = document.querySelector('.hero');
                const cue = document.querySelector('.scroll-cue');
                let ticking = false;
                function update() {
                    const y = window.scrollY || window.pageYOffset || 0;
                    const vh = window.innerHeight || 1;
                    const p = Math.min(1, y / vh);
                    canvas.style.opacity = String(Math.max(0, 1 - p * 1.1));
                    canvas.style.transform = 'scale(' + (1 - 0.12 * p).toFixed(4) + ')';
                    if (hero) {
                        hero.style.opacity = String(Math.max(0, 1 - p * 1.15));
                        hero.style.transform = 'translateY(' + (-y * 0.28).toFixed(2) + 'px)';
                    }
                    if (cue) cue.style.opacity = String(Math.max(0, 0.9 - p * 4));
                    ticking = false;
                }
                window.addEventListener('scroll', function () {
                    if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
                }, { passive: true });
                window.addEventListener('resize', update, { passive: true });
                update();
            }
        })();
    </script>
